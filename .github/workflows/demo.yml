name: Demo

# Fait tourner la VRAIE app native dans le simulateur iPhone et livre
# un artefact téléchargeable : captures d'écran de chaque écran, vidéo
# du tour complet, et archive .ipa non signée. Aucun secret requis —
# utilisable pendant le développement, sans compte Apple.
#
# GitHub → Actions → Demo → Run workflow, puis ouvrir le run terminé et
# télécharger l'artefact « budget-demo » (lisible depuis l'app Fichiers
# de l'iPhone).

on:
  workflow_dispatch:

jobs:
  demo:
    name: Tour simulateur (captures + vidéo + ipa)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Le nom du simulateur n'est PAS figé : certaines images `macos-15`
      # ne livrent aucun « iPhone 16 » (run 31028475843 : « no available
      # devices matched the request », seuls les emplacements génériques
      # existaient). On résout donc un iPhone disponible, et on en CRÉE un
      # si le runner n'en a aucun. Échec explicite s'il n'y a même pas de
      # runtime iOS — jamais une capture silencieusement absente.
      - name: Résoudre (ou créer) un simulateur iPhone
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          best = None
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime: continue
              for d in devices:
                  if not d['name'].startswith('iPhone'): continue
                  # On préfère le plus récent trouvé, sans figer un modèle.
                  best = d['udid']
                  if d['name'] == 'iPhone 16': print(d['udid']); sys.exit()
          print(best or '')
          ")
          if [ -z "$UDID" ]; then
            echo "Aucun iPhone disponible — création."
            RUNTIME=$(xcrun simctl list runtimes --json \
              | python3 -c "import json,sys; rs=[r['identifier'] for r in json.load(sys.stdin)['runtimes'] if r.get('isAvailable') and 'iOS' in r['identifier']]; print(rs[-1] if rs else '')")
            if [ -z "$RUNTIME" ]; then
              echo "::error::Aucun runtime iOS sur ce runner — impossible de produire les captures."
              exit 1
            fi
            TYPE=$(xcrun simctl list devicetypes --json \
              | python3 -c "import json,sys; ts=[t['identifier'] for t in json.load(sys.stdin)['devicetypes'] if 'iPhone' in t['identifier']]; print(ts[-1] if ts else '')")
            UDID=$(xcrun simctl create "Budget Demo" "$TYPE" "$RUNTIME")
          fi
          echo "Simulateur retenu : $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild \
            -project Budget.xcodeproj \
            -scheme Budget \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Démarrer le simulateur + enregistrement vidéo
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID"
          mkdir -p demo-output
          (xcrun simctl io "$UDID" recordVideo --codec h264 demo-output/tour-complet.mp4 & echo $! > video.pid)

      - name: Tour de l'app (tests UI)
        run: |
          set -o pipefail
          xcodebuild \
            -project Budget.xcodeproj \
            -scheme Budget \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath DemoResults.xcresult \
            -only-testing:BudgetUITests \
            -only-testing:BudgetTests/ObsidianMotionTests \
            test-without-building

      - name: Rapports de crash + journal de l'app
        if: always()
        run: |
          echo "=== Rapports de crash (hôte) ==="
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || echo "aucun"
          for f in ~/Library/Logs/DiagnosticReports/*; do
            echo "--- $f"; head -c 6000 "$f" 2>/dev/null; echo
          done || true
          echo "=== Journal du process Budget (10 dernières minutes) ==="
          xcrun simctl spawn "$UDID" log show --last 10m \
            --predicate 'processImagePath CONTAINS "Budget"' \
            --style compact 2>/dev/null | tail -200 || true

      - name: Arrêter la vidéo
        if: always()
        run: |
          if [ -f video.pid ]; then
            kill -INT "$(cat video.pid)" || true
            sleep 5
          fi
          ls -la demo-output || true

      - name: Exporter les captures d'écran
        if: always()
        run: |
          if [ -d DemoResults.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path DemoResults.xcresult \
              --output-path demo-output/captures | tee /tmp/attmap.txt || true
            ls -R demo-output/captures || true
          fi

      - name: Preuves ios-l8 en base64 (inspection directe depuis les logs)
        if: always()
        run: |
          # Le stockage d'artefacts est inaccessible depuis certains
          # environnements de revue : les pièces à INSPECTER sont donc AUSSI
          # imprimées en base64 dans les logs. Depuis NU3, ce sont les trois
          # surfaces pilotes (Mois, Budget, Nouveau mouvement) — sans quoi le
          # rebranchement natif ne serait jamais vérifié à l'œil.
          for NAME in 01-accueil 03-budget 12-nouveau-mouvement ios-l8-patrimoine-selection-320-a11y; do
            # xcresulttool suffixe les noms (« NAME_0_UUID.png ») — et un
            # nom peut être le préfixe d'un autre : on ancre sur « NAME_ ».
            F=$(grep -F "suggested name: \"${NAME}_" /tmp/attmap.txt | head -1 | sed -E 's/^File: ([^,]+),.*/\1/')
            P=""
            if [ -n "$F" ]; then P=$(find demo-output/captures -name "$F" 2>/dev/null | head -1); fi
            if [ -n "$P" ]; then
              echo "===B64 $NAME START==="
              base64 -i "$P"
              echo "===B64 $NAME END==="
            else
              echo "INTROUVABLE : $NAME"
            fi
          done

      - name: Archive .ipa non signée (pour plus tard)
        run: |
          set -o pipefail
          xcodebuild \
            -project Budget.xcodeproj \
            -scheme Budget \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Budget.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive
          mkdir -p Payload
          cp -R build/Budget.xcarchive/Products/Applications/Budget.app Payload/
          zip -qry demo-output/Budget-non-signee.ipa Payload
          echo "ipa: $(du -h demo-output/Budget-non-signee.ipa | cut -f1)"

      # ADR-023 : la liste ENTIÈRE UIDeviceFamily doit valoir [1] dans
      # l'app de l'ARCHIVE et dans l'app EXTRAITE de l'IPA — pas
      # seulement contenir 1.
      - name: iPhone uniquement — UIDeviceFamily == [1] (archive + IPA)
        run: |
          check_family() {
            FAM=$(plutil -extract UIDeviceFamily json -o - "$1" | tr -d '[:space:]')
            if [ "$FAM" != "[1]" ]; then
              echo "::error::UIDeviceFamily = $FAM dans $1 (attendu EXACTEMENT [1])"; exit 1
            fi
            echo "UIDeviceFamily == [1] dans $1 ✓"
          }
          check_family "build/Budget.xcarchive/Products/Applications/Budget.app/Info.plist"
          rm -rf ipa-extract && mkdir ipa-extract
          unzip -q demo-output/Budget-non-signee.ipa -d ipa-extract
          check_family "ipa-extract/Payload/Budget.app/Info.plist"

      - name: Publier l'artefact budget-demo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budget-demo
          path: demo-output
          if-no-files-found: error

      - name: Résultats de test en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DemoResults
          path: DemoResults.xcresult
          if-no-files-found: ignore
