name: CI

on:
  push:
    branches:
      - "claude/**"
      - "codex/**"
      - "refonte/**"
      - "version/**"
      - main
  pull_request:
  workflow_dispatch:

jobs:
  web-tests:
    name: Web (e2e navigateur réel)
    runs-on: ubuntu-latest
    # 15 minutes tuaient les runs quand le CDN Playwright traînait : le
    # téléchargement de Chromium pendait, le job partait en « cancelled »
    # (runs 32226819348, 32228559711, 32230552234). La suite e2e à 156
    # parcours prend ~8 min ; 25 min laissent la marge honnête.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Catalogue des identités (contrat ADR-037 + parité des glyphes)
        run: node webapp/tests/catalogue.test.mjs

      - name: Schéma des fixtures canoniques (contrat W1.1, ADR-059)
        run: node webapp/tests/canon-schema.test.mjs

      - name: Catalogue natif généré (aucune dérive vs la fixture)
        run: node .github/scripts/generate-identity-catalog.mjs --check

      # Le navigateur ne se retélécharge plus à chaque run — c'était la
      # source des pendaisons. Clé figée sur la version épinglée.
      - name: Cache du navigateur Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.61.1-${{ runner.os }}

      # W9.1 — build TypeScript « à vide » : porte de types + artefact
      # vérifié au octet près contre le monofichier servi. Version de
      # typescript ÉPINGLÉE dans webapp/build/package.json (même motif
      # que playwright ci-dessous).
      - name: Build TypeScript (W9.1 — types + artefact au octet près)
        working-directory: webapp/build
        run: |
          npm install --no-audit --no-fund
          node build.mjs --check

      - name: Suite du pipeline de build (webapp/tests/build.test.mjs)
        working-directory: webapp/tests
        run: node build.test.mjs

      - name: Dépendances (Playwright + Chromium)
        working-directory: webapp/tests
        run: |
          npm install playwright@1.61.1
          # « --with-deps » gelait le job : le miroir apt
          # azure.archive.ubuntu.com pend par périodes (runs 32236297184,
          # 32230552234 — 25 min de silence après « Ign:14 azure.archive »).
          # L'image ubuntu-24.04 porte déjà les bibliothèques du navigateur ;
          # installation SANS apt, navigateur servi par le cache ci-dessus.
          npx playwright install chromium

      - name: Suite e2e (Chromium réel, zéro erreur console tolérée)
        working-directory: webapp/tests
        run: |
          BUDGET_CHROMIUM="$(node -e 'console.log(require("playwright").chromium.executablePath())')" \
          node e2e.test.mjs

      - name: Comparateur du domaine extrait (W9.2 — miroir TS ≡ monofichier)
        working-directory: webapp/tests
        run: |
          BUDGET_CHROMIUM="$(node -e 'console.log(require("playwright").chromium.executablePath())')" \
          node domaine.test.mjs

      - name: Suite de parité web/natif (fixtures canoniques)
        working-directory: webapp/tests
        run: |
          BUDGET_CHROMIUM="$(node -e 'console.log(require("playwright").chromium.executablePath())')" \
          node parity.test.mjs

      - name: Runner canonique Web (fixtures canon, gate FI-40 — W1.6)
        working-directory: webapp/tests
        run: |
          BUDGET_CHROMIUM="$(node -e 'console.log(require("playwright").chromium.executablePath())')" \
          node canon.test.mjs

      - name: Design system Obsidian (tokens, contrastes, galerie, a11y)
        working-directory: webapp/tests
        run: |
          BUDGET_CHROMIUM="$(node -e 'console.log(require("playwright").chromium.executablePath())')" \
          node design.test.mjs

  build-and-test:
    name: Build + tests (simulateur iOS)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version d'Xcode
        run: xcodebuild -version

      - name: Manifeste de confidentialité valide (plutil)
        run: plutil -lint Budget/PrivacyInfo.xcprivacy

      - name: Simulateurs disponibles
        run: xcrun simctl list devices available | head -40

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Budget.xcodeproj \
            -scheme Budget \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Tests unitaires
        run: |
          set -o pipefail
          xcodebuild \
            -project Budget.xcodeproj \
            -scheme Budget \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult \
            -skip-testing:BudgetUITests \
            test

      # Vérification d'archive (Phase 14) : le build Release doit passer
      # aussi proprement que le Debug — sans signature, faute de compte
      # développeur en CI. derivedDataPath connu pour inspecter le produit.
      - name: Build Release (vérification d'archive)
        run: |
          set -o pipefail
          xcodebuild \
            -project Budget.xcodeproj \
            -scheme Budget \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      # P0-4 Obsidian L1 : le manifeste doit exister DANS le produit
      # Release compilé (les groupes synchronisés Xcode 16 l'embarquent) —
      # échec de CI sinon.
      - name: Manifeste de confidentialité présent dans Budget.app (Release)
        run: |
          APP="DerivedData/Build/Products/Release-iphonesimulator/Budget.app"
          test -d "$APP" || { echo "::error::Budget.app introuvable sous $APP"; exit 1; }
          test -f "$APP/PrivacyInfo.xcprivacy" || { echo "::error::PrivacyInfo.xcprivacy ABSENT du produit Release"; exit 1; }
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          echo "PrivacyInfo.xcprivacy présent et valide dans Budget.app ✓"

      # ADR-023 : prise en charge native iPhone UNIQUEMENT. La liste
      # ENTIÈRE doit valoir exactement [1] — la simple présence de 1 ne
      # suffit pas ([1,2] doit échouer).
      - name: iPhone uniquement — UIDeviceFamily == [1] (produit Release)
        run: |
          PLIST="DerivedData/Build/Products/Release-iphonesimulator/Budget.app/Info.plist"
          FAM=$(plutil -extract UIDeviceFamily json -o - "$PLIST" | tr -d '[:space:]')
          if [ "$FAM" != "[1]" ]; then
            echo "::error::UIDeviceFamily = $FAM dans $PLIST (attendu EXACTEMENT [1])"; exit 1
          fi
          echo "UIDeviceFamily == [1] dans le produit Release ✓"

      # Preuve secondaire ADR-023 : le réglage de cible lui-même, en
      # Debug ET en Release.
      - name: iPhone uniquement — preuve secondaire (build settings)
        run: |
          for CONF in Debug Release; do
            VAL=$(xcodebuild \
              -project Budget.xcodeproj \
              -scheme Budget \
              -configuration "$CONF" \
              -destination 'platform=iOS Simulator,name=iPhone 16' \
              -showBuildSettings 2>/dev/null \
              | awk -F' = ' '$1 ~ /TARGETED_DEVICE_FAMILY/ { print $2; exit }')
            if [ "$VAL" != "1" ]; then
              echo "::error::TARGETED_DEVICE_FAMILY = '$VAL' en $CONF (attendu 1)"; exit 1
            fi
            echo "TARGETED_DEVICE_FAMILY = 1 en $CONF ✓"
          done

      - name: Publier le bundle de résultats en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
