name: CI

on:
  push:
    branches:
      - "claude/**"
      - "codex/**"
      - "refonte/**"
      - "version/**"
      - main
  pull_request:
  workflow_dispatch:

jobs:
  web-tests:
    name: Web (e2e navigateur réel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dépendances (Playwright + Chromium)
        working-directory: webapp/tests
        run: |
          npm install playwright@1.61.1
          npx playwright install --with-deps chromium

      - name: Suite e2e (Chromium réel, zéro erreur console tolérée)
        working-directory: webapp/tests
        run: |
          BUDGET_CHROMIUM="$(node -e 'console.log(require("playwright").chromium.executablePath())')" \
          node e2e.test.mjs

      - name: Suite de parité web/natif (fixtures canoniques)
        working-directory: webapp/tests
        run: |
          BUDGET_CHROMIUM="$(node -e 'console.log(require("playwright").chromium.executablePath())')" \
          node parity.test.mjs

      - name: Design system Obsidian (tokens, contrastes, galerie, a11y)
        working-directory: webapp/tests
        run: |
          BUDGET_CHROMIUM="$(node -e 'console.log(require("playwright").chromium.executablePath())')" \
          node design.test.mjs

  build-and-test:
    name: Build + tests (simulateur iOS)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version d'Xcode
        run: xcodebuild -version

      - name: Manifeste de confidentialité valide (plutil)
        run: plutil -lint Budget/PrivacyInfo.xcprivacy

      - name: Simulateurs disponibles
        run: xcrun simctl list devices available | head -40

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Budget.xcodeproj \
            -scheme Budget \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Tests unitaires
        run: |
          set -o pipefail
          xcodebuild \
            -project Budget.xcodeproj \
            -scheme Budget \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult \
            -skip-testing:BudgetUITests \
            test

      # Vérification d'archive (Phase 14) : le build Release doit passer
      # aussi proprement que le Debug — sans signature, faute de compte
      # développeur en CI. derivedDataPath connu pour inspecter le produit.
      - name: Build Release (vérification d'archive)
        run: |
          set -o pipefail
          xcodebuild \
            -project Budget.xcodeproj \
            -scheme Budget \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      # P0-4 Obsidian L1 : le manifeste doit exister DANS le produit
      # Release compilé (les groupes synchronisés Xcode 16 l'embarquent) —
      # échec de CI sinon.
      - name: Manifeste de confidentialité présent dans Budget.app (Release)
        run: |
          APP="DerivedData/Build/Products/Release-iphonesimulator/Budget.app"
          test -d "$APP" || { echo "::error::Budget.app introuvable sous $APP"; exit 1; }
          test -f "$APP/PrivacyInfo.xcprivacy" || { echo "::error::PrivacyInfo.xcprivacy ABSENT du produit Release"; exit 1; }
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          echo "PrivacyInfo.xcprivacy présent et valide dans Budget.app ✓"

      # ADR-023 : prise en charge native iPhone UNIQUEMENT. La liste
      # ENTIÈRE doit valoir exactement [1] — la simple présence de 1 ne
      # suffit pas ([1,2] doit échouer).
      - name: iPhone uniquement — UIDeviceFamily == [1] (produit Release)
        run: |
          PLIST="DerivedData/Build/Products/Release-iphonesimulator/Budget.app/Info.plist"
          FAM=$(plutil -extract UIDeviceFamily json -o - "$PLIST" | tr -d '[:space:]')
          if [ "$FAM" != "[1]" ]; then
            echo "::error::UIDeviceFamily = $FAM dans $PLIST (attendu EXACTEMENT [1])"; exit 1
          fi
          echo "UIDeviceFamily == [1] dans le produit Release ✓"

      # Preuve secondaire ADR-023 : le réglage de cible lui-même, en
      # Debug ET en Release.
      - name: iPhone uniquement — preuve secondaire (build settings)
        run: |
          for CONF in Debug Release; do
            VAL=$(xcodebuild \
              -project Budget.xcodeproj \
              -scheme Budget \
              -configuration "$CONF" \
              -destination 'platform=iOS Simulator,name=iPhone 16' \
              -showBuildSettings 2>/dev/null \
              | awk -F' = ' '$1 ~ /TARGETED_DEVICE_FAMILY/ { print $2; exit }')
            if [ "$VAL" != "1" ]; then
              echo "::error::TARGETED_DEVICE_FAMILY = '$VAL' en $CONF (attendu 1)"; exit 1
            fi
            echo "TARGETED_DEVICE_FAMILY = 1 en $CONF ✓"
          done

      - name: Publier le bundle de résultats en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
