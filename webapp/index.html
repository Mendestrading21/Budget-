<title>Budget</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    --graphite: #0B0E14;
    --midnight: #0F1624;
    --slate: #1E2333;
    --indigo: #4B5CFF;
    --electric: #5AA7FF;
    --violet: #8B5CF6;
    --offwhite: #F2F4F8;
    --coolgray: #7A8699;
    --positive: #39D98A;
    --negative: #FF667A;
    --amber: #FFB24D;
    --card-radius: 22px;
    --row-radius: 14px;
  }

  /* Le prototype assume l'identité canonique sombre de l'app,
     quel que soit le thème du viewer. */
  html, body { background: #07090e; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    color: var(--offwhite);
    margin: 0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
    overflow: hidden;
    background:
      radial-gradient(1000px 520px at 50% -140px, rgba(75, 92, 255, 0.16), transparent 65%),
      radial-gradient(700px 420px at 85% 100%, rgba(139, 92, 246, 0.08), transparent 60%),
      #07090e;
  }

  .stage-caption {
    text-align: center;
    margin-bottom: 18px;
    max-width: 420px;
  }
  .stage-caption h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
    background: linear-gradient(120deg, var(--electric), var(--indigo), var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .stage-caption p {
    margin: 0;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--coolgray);
  }

  /* ---------- App container (full screen, no phone frame) ---------- */
  .phone {
    width: min(560px, 100%);
    height: 100%;
    background: linear-gradient(180deg, var(--graphite), var(--midnight) 70%);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  @media (min-width: 561px) {
    .phone {
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }
  }
  .notch { display: none; }

  .screen {
    flex: 1;
    overflow-y: auto;
    padding: 14px 18px 20px;
    scrollbar-width: none;
  }
  .screen::-webkit-scrollbar { display: none; }

  .demo-banner {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: calc(8px + env(safe-area-inset-top)) 18px 0;
    padding: 7px 12px;
    border-radius: 10px;
    background: rgba(75, 92, 255, 0.22);
    border: 1px solid rgba(75, 92, 255, 0.4);
    font-size: 11px;
    color: #C9D2FF;
  }

  h2.screen-title {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin: 6px 0 14px;
  }

  /* ---------- Glass cards ---------- */
  .card {
    position: relative;
    background: rgba(15, 22, 36, 0.55);
    border-radius: var(--card-radius);
    padding: 18px;
    margin-bottom: 14px;
    border: 1px solid transparent;
    background-clip: padding-box;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(75,92,255,0.28), transparent 70%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(135deg, rgba(255,255,255,0.06), transparent 45%);
    pointer-events: none;
  }
  .card.hero {
    background: rgba(20, 27, 45, 0.72);
    box-shadow: 0 18px 40px rgba(75, 92, 255, 0.13);
  }
  .card.row {
    border-radius: var(--row-radius);
    padding: 12px 14px;
    margin-bottom: 8px;
  }

  .card-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--coolgray);
    margin: 0 0 6px;
  }
  .hero-amount {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    margin: 0;
  }
  .amount { font-variant-numeric: tabular-nums; font-weight: 600; }
  .caption { font-size: 11.5px; color: var(--coolgray); }
  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--coolgray);
    margin: 18px 0 8px;
  }

  .pos { color: var(--positive); }
  .neg { color: var(--negative); }
  .warn { color: var(--amber); }
  .info { color: var(--electric); }

  /* ---------- Month selector ---------- */
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .month-nav button {
    background: rgba(30, 35, 51, 0.8);
    color: var(--electric);
    border: 1px solid rgba(255,255,255,0.08);
    width: 44px; height: 44px;
    border-radius: 11px;
    font-size: 16px;
    cursor: pointer;
  }
  .month-nav button:disabled { opacity: 0.3; cursor: default; }
  .month-nav .label { font-size: 16px; font-weight: 700; text-transform: capitalize; }

  /* ---------- Breakdown ---------- */
  details summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--electric);
    margin-top: 8px;
    list-style: none;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: " ›"; }
  details[open] summary::after { content: " ˅"; }
  .breakdown { margin-top: 8px; display: grid; gap: 5px; }
  .breakdown div {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--coolgray);
  }
  .breakdown div span:last-child { font-variant-numeric: tabular-nums; color: var(--offwhite); }

  /* ---------- Stat grid ---------- */
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .stat {
    background: rgba(15, 22, 36, 0.55);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px;
    padding: 12px 14px;
  }
  .stat .card-label { margin-bottom: 4px; font-size: 10.5px; }
  .stat .amount { font-size: 17px; display: block; }
  .stat .caption { display: block; margin-top: 3px; }

  /* ---------- Budget bars ---------- */
  .bar-row { margin-bottom: 12px; }
  .bar-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12.5px; margin-bottom: 5px;
  }
  .bar-head .vals { color: var(--coolgray); font-variant-numeric: tabular-nums; font-size: 11.5px; }
  .track {
    height: 7px; border-radius: 5px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .fill {
    height: 100%;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--electric), var(--indigo));
    transition: width 0.5s ease;
  }
  .fill.warn-fill { background: linear-gradient(90deg, var(--amber), #ff9d2e); }
  .fill.over-fill { background: linear-gradient(90deg, #ff8a99, var(--negative)); }
  .badge {
    display: inline-block;
    font-size: 10px; font-weight: 700;
    padding: 2px 7px; border-radius: 99px;
    background: rgba(255, 102, 122, 0.2);
    color: var(--negative);
    margin-left: 6px;
    vertical-align: 1px;
  }
  .badge.planned {
    background: rgba(255, 178, 77, 0.18);
    color: var(--amber);
  }
  .bar-foot { text-align: right; font-size: 11px; color: var(--coolgray); margin-top: 3px; }

  /* ---------- Lists ---------- */
  .tx {
    display: flex; align-items: center; gap: 12px;
  }
  .tx .ico {
    flex: none;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 11px;
    background: rgba(75, 92, 255, 0.16);
    color: var(--electric);
    font-size: 15px;
  }
  .tx .meta { flex: 1; min-width: 0; }
  .tx .meta .t { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx .meta .s { font-size: 11px; color: var(--coolgray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx .amount { font-size: 13.5px; flex: none; }

  .acct-total { font-size: 20px; }

  /* ---------- Tab bar ---------- */
  .tabbar {
    flex: none;
    display: flex;
    border-top: 1px solid rgba(255,255,255,0.08);
    background: rgba(9, 12, 19, 0.92);
    backdrop-filter: blur(14px);
    padding: 8px 6px calc(14px + env(safe-area-inset-bottom));
  }
  .tabbar button {
    flex: 1;
    background: none;
    border: none;
    color: var(--coolgray);
    font-family: inherit;
    font-size: 10px;
    font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer;
    padding: 4px 0;
  }
  .tabbar button svg { width: 22px; height: 22px; }
  .tabbar button.active { color: var(--indigo); }
  .tabbar button:focus-visible { outline: 2px solid var(--electric); border-radius: 8px; }

  /* ---------- Buttons / form ---------- */
  .btn {
    display: inline-block;
    background: linear-gradient(135deg, var(--indigo), var(--violet));
    color: #fff;
    border: none;
    font-family: inherit;
    font-size: 14px; font-weight: 700;
    padding: 12px 18px;
    border-radius: 13px;
    cursor: pointer;
    width: 100%;
  }
  .btn.secondary {
    background: rgba(30, 35, 51, 0.9);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--electric);
  }
  .fab {
    position: absolute;
    right: 20px; bottom: calc(92px + env(safe-area-inset-bottom));
    width: 50px; height: 50px;
    border-radius: 17px;
    border: none;
    background: linear-gradient(135deg, var(--indigo), var(--violet));
    color: #fff; font-size: 24px;
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(75, 92, 255, 0.4);
    display: grid; place-items: center;
    line-height: 0;
  }

  .sheet-backdrop {
    position: absolute; inset: 0;
    background: rgba(4, 6, 10, 0.6);
    backdrop-filter: blur(3px);
    display: none;
    align-items: flex-end;
    z-index: 10;
  }
  .sheet-backdrop.open { display: flex; }
  .sheet {
    width: 100%;
    background: var(--slate);
    border-radius: 26px 26px 0 0;
    padding: 18px 20px 26px;
    animation: rise 0.28s ease;
  }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .sheet { animation: none; }
    .fill { transition: none; }
  }
  .sheet h3 { margin: 0 0 14px; font-size: 17px; }
  .sheet label { display: block; font-size: 11px; font-weight: 600; color: var(--coolgray); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; }
  .sheet input, .sheet select {
    width: 100%;
    box-sizing: border-box;
    background: rgba(11, 14, 20, 0.8);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--offwhite);
    font-family: inherit;
    font-size: 15px;
    padding: 11px 12px;
    border-radius: 11px;
  }
  .sheet input:focus, .sheet select:focus { outline: 2px solid var(--indigo); }
  .sheet .error { color: var(--negative); font-size: 12px; margin-top: 8px; min-height: 15px; }
  .sheet .actions { display: flex; gap: 10px; margin-top: 16px; }

  .toast {
    position: absolute;
    left: 50%;
    bottom: calc(96px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: rgba(30, 35, 51, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: var(--offwhite);
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 13px;
    max-width: 82%;
    text-align: center;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
    z-index: 30;
  }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

  .placeholder-list div {
    display: flex; justify-content: space-between; align-items: center;
    padding: 13px 2px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 14px;
  }
  .placeholder-list .soon { font-size: 11px; color: var(--coolgray); }

  .footnote {
    margin-top: 20px;
    font-size: 11.5px;
    color: #5c6678;
    text-align: center;
    max-width: 420px;
    line-height: 1.55;
  }
  .footnote a { color: var(--electric); }
</style>

<div class="phone" id="phone">

<script>
"use strict";

/* ---------- Formatage fr-CH : CHF 18'190.00 ---------- */
function chf(n, signed) {
  const neg = n < 0;
  const abs = Math.abs(n);
  const [int, dec] = abs.toFixed(2).split(".");
  const grouped = int.replace(/\B(?=(\d{3})+(?!\d))/g, "'");
  const sign = neg ? "-" : (signed ? "+" : "");
  return sign + "CHF " + grouped + "." + dec;
}
function pct(f) { return (f * 100).toFixed(f * 100 % 1 ? 1 : 0).replace(".", ",") + " %"; }

/* ---------- Données de démonstration (miroir de DemoDataFactory) ---------- */
const NOW = { y: 2026, m: 6, d: 15 };
const MONTHS = [
  { y: 2026, m: 4, label: "avril 2026" },
  { y: 2026, m: 5, label: "mai 2026" },
  { y: 2026, m: 6, label: "juin 2026" },
];
const TAX_RATE = 0.30;

const CATEGORIES = {
  Salaire: "income", Logement: "expense", "Assurance maladie": "expense",
  Alimentation: "expense", Transports: "expense", "Restaurants et sorties": "expense",
  Épargne: "saving", "Pilier 3a": "investment", Impôts: "tax",
};

const ACCOUNTS_SEED = [
  { id: "cur", name: "Compte ménage", inst: "Banque Exemple", kind: "current", opening: 4200, cash: true },
  { id: "sav", name: "Épargne", inst: "Banque Exemple", kind: "savings", opening: 12500, cash: false },
  { id: "p3a", name: "Pilier 3a", inst: "Fondation Exemple", kind: "pension", opening: 18190, cash: false },
  { id: "cash", name: "Espèces", inst: "", kind: "cash", opening: 150, cash: true },
];
const ACCOUNT_KINDS = {
  current: { label: "Compte courant", icon: "💳" },
  savings: { label: "Compte épargne", icon: "🏛" },
  cash: { label: "Espèces", icon: "💵" },
  pension: { label: "Prévoyance (3a, LPP)", icon: "🛡" },
};

const BUDGET_TEMPLATE = [
  ["Logement", 2150], ["Assurance maladie", 750], ["Alimentation", 650],
  ["Transports", 150], ["Restaurants et sorties", 250],
  ["Épargne", 600], ["Pilier 3a", 587], ["Impôts", 850],
];

let txSeq = 0;
function monthTemplate(y, m) {
  const mk = (d, title, amount, type, cat, acc, dest) => ({
    id: ++txSeq, y, m, d, title, amount, type, cat: cat || null, acc, dest: dest || null,
    status: (y === NOW.y && m === NOW.m && d > NOW.d) ? "planned" : "posted",
  });
  return [
    mk(1, "Loyer", 2150, "expense", "Logement", "cur"),
    mk(3, "Primes maladie", 745.60, "expense", "Assurance maladie", "cur"),
    mk(6, "Courses de la semaine", 512.35, "expense", "Alimentation", "cur"),
    mk(8, "Abonnement transports", 120, "expense", "Transports", "cur"),
    mk(12, "Restaurant en famille", 98.50, "expense", "Restaurants et sorties", "cur"),
    mk(15, "Épargne mensuelle", 600, "saving", "Épargne", "cur", "sav"),
    mk(16, "Versement 3a", 587, "investment", "Pilier 3a", "cur", "p3a"),
    mk(18, "Retrait espèces", 200, "transfer", null, "cur", "cash"),
    mk(20, "Acompte d'impôts", 850, "taxPayment", "Impôts", "cur"),
    mk(25, "Salaire", 8450, "income", "Salaire", "cur"),
  ];
}

/* Récurrents (Phase 6) : occurrences à venir du mois courant, pas encore
   comptabilisées — elles pèsent sur le « Vraiment disponible ». */
const RECURRINGS_SEED = [
  { id: "r-salaire", title: "Salaire", amount: 8450.00, type: "income", cat: "Salaire", day: 25, icon: "💰" },
  { id: "r-streaming", title: "Streaming vidéo", amount: 21.90, type: "expense", cat: "Restaurants et sorties", day: 22, icon: "📺" },
  { id: "r-sport", title: "Salle de sport", amount: 89.00, type: "expense", cat: "Restaurants et sorties", day: 28, icon: "🏋" },
];

/* Objectifs (Phase 8) — contribution requise = (cible − actuel) ÷ mois restants. */
const GOALS_SEED = [
  { name: "Fonds d'urgence", emoji: "🛟", target: 10000, current: 6500, monthly: 600, due: "décembre 2026", monthsLeft: 6, priority: "Prioritaire" },
  { name: "Vacances été 2027", emoji: "🏖", target: 3500, current: 950, monthly: 200, due: "juillet 2027", monthsLeft: 13, priority: "Normal" },
];

/* Patrimoine hors comptes (Phase 10) et prévoyance (Phase 9). */
const ASSETS_SEED = [{ name: "Voiture", icon: "🚗", value: 8500 }];
const LIABILITIES_SEED = [{ name: "Leasing voiture", icon: "📄", value: 6200 }];
const PENSIONS_SEED = [{ name: "Caisse LPP (2e pilier)", icon: "🛡", value: 42300, projection: 245000 }];
const INSURANCES_SEED = [
  { name: "Caisse maladie (LAMal)", insurer: "Assureur Exemple", monthly: 745.60, icon: "🩺" },
  { name: "RC + ménage", insurer: "Assureur Exemple", monthly: 32.50, note: "CHF 390.00 par an", icon: "🏠" },
];

/* ---------- État persistant unique (localStorage de CET appareil) ----------
   TOUT l'état de l'app vit dans `S`, sauvegardé après chaque mutation.
   Rien ne quitte jamais l'appareil (contrat budget-web). */
const APP_STATE_KEY = "budget-app-state-v1";
const LEGACY_TX_KEY = "budget-proto-mouvements";

function seedState() {
  txSeq = 0;
  return {
    version: 1,
    faceIDEnabled: false,
    taxReserve: 2400,
    budgets: Object.fromEntries(MONTHS.map(({ y, m }) =>
      [`${y}-${m}`, BUDGET_TEMPLATE.map(([cat, amount]) => ({ cat, amount }))])),
    transactions: MONTHS.flatMap(({ y, m }) => monthTemplate(y, m)),
    accounts: ACCOUNTS_SEED.map(a => ({ ...a })),
    recurrings: RECURRINGS_SEED.map(r => ({ ...r })),
    goals: GOALS_SEED.map(g => ({ ...g })),
    assets: ASSETS_SEED.map(a => ({ ...a })),
    liabilities: LIABILITIES_SEED.map(l => ({ ...l })),
    pensions: PENSIONS_SEED.map(p => ({ ...p })),
    insurances: INSURANCES_SEED.map(i => ({ ...i })),
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(APP_STATE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || s.version !== 1 || !Array.isArray(s.transactions) || !Array.isArray(s.accounts)) return null;
    for (const key of ["recurrings", "goals", "assets", "liabilities", "pensions", "insurances"]) {
      if (!Array.isArray(s[key])) s[key] = [];
    }
    const inferKind = { cur: "current", sav: "savings", p3a: "pension", cash: "cash" };
    for (const account of s.accounts) {
      if (!account.kind) account.kind = inferKind[account.id] || "current";
    }
    if (!s.budgets || typeof s.budgets !== "object") {
      s.budgets = Object.fromEntries(MONTHS.map(({ y, m }) =>
        [`${y}-${m}`, BUDGET_TEMPLATE.map(([cat, amount]) => ({ cat, amount }))]));
    }
    return s;
  } catch (e) { return null; }
}

let S = loadState();
if (!S) {
  S = seedState();
  // Reprendre les mouvements ajoutés avec l'ancienne version de la page.
  try {
    for (const t of JSON.parse(localStorage.getItem(LEGACY_TX_KEY) || "[]")) S.transactions.push(t);
    localStorage.removeItem(LEGACY_TX_KEY);
  } catch (e) { /* stockage indisponible : l'app reste utilisable */ }
}
txSeq = S.transactions.reduce((max, t) => Math.max(max, t.id || 0), txSeq);

// Alias STABLES vers l'état : toute mutation doit se faire EN PLACE
// (push/splice/length=0), jamais par réaffectation.
const transactions = S.transactions;
const ACCOUNTS = S.accounts;
const RECURRINGS = S.recurrings;
const GOALS = S.goals;
const ASSETS = S.assets;
const LIABILITIES = S.liabilities;
const PENSIONS = S.pensions;
const INSURANCES = S.insurances;

function saveState() {
  try { localStorage.setItem(APP_STATE_KEY, JSON.stringify(S)); }
  catch (e) { toast("Stockage indisponible — ce changement ne survivra pas au rechargement"); }
}

/* Échappement systématique des textes utilisateur injectés en HTML. */
function esc(value) {
  return String(value).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
}

/* ---------- Services (miroir des services Swift) ---------- */
const OUTFLOWS = new Set(["expense", "saving", "investment", "transfer", "taxPayment", "debtPayment"]);

function balance(accId) {
  const account = ACCOUNTS.find(a => a.id === accId);
  if (!account) return 0;
  let b = account.opening;
  for (const t of transactions) {
    if (t.status !== "posted") continue;
    if (t.acc === accId) b += (t.type === "income" || t.type === "refund") ? t.amount : (OUTFLOWS.has(t.type) ? -t.amount : 0);
    if (t.dest === accId) b += t.amount;
  }
  return b;
}

function inMonth(t, y, m) { return t.y === y && t.m === m; }

function snapshot(y, m) {
  const posted = transactions.filter(t => inMonth(t, y, m) && t.status === "posted");
  const planned = transactions.filter(t => inMonth(t, y, m) && t.status === "planned");
  const sum = (list, type) => list.filter(t => t.type === type).reduce((a, t) => a + t.amount, 0);

  const income = sum(posted, "income");
  const living = sum(posted, "expense") - sum(posted, "refund");
  const savings = sum(posted, "saving");
  const invest = sum(posted, "investment");
  const taxes = sum(posted, "taxPayment");

  const plannedIncome = sum(planned, "income");
  const plannedOut = ["expense", "saving", "investment", "taxPayment"].reduce((a, ty) => a + sum(planned, ty), 0);

  const taxRecommended = Math.round(income * TAX_RATE * 100) / 100;
  const taxGap = Math.max(0, taxRecommended - taxes);

  const liquid = ACCOUNTS.filter(a => a.cash).reduce((a, acc) => a + balance(acc.id), 0);
  const isCurrent = (y === NOW.y && m === NOW.m);
  // Occurrences récurrentes encore à venir ce mois, dédupliquées contre
  // les mouvements déjà saisis/planifiés (même titre, même mois) — la
  // règle native : chaque charge apparaît exactement une fois.
  const upcomingRecurrings = isCurrent
    ? RECURRINGS.filter(r => r.day > NOW.d
        && !transactions.some(t => inMonth(t, y, m) && t.title === r.title))
    : [];
  const recurringCharges = upcomingRecurrings.reduce((a, r) => a + (r.type === "expense" ? r.amount : 0), 0);
  const recurringIncome = upcomingRecurrings.reduce((a, r) => a + (r.type === "income" ? r.amount : 0), 0);
  const available = liquid + plannedIncome + recurringIncome - plannedOut - recurringCharges - taxGap;
  const daysInMonth = new Date(y, m, 0).getDate();
  const daysRemaining = isCurrent ? (daysInMonth - NOW.d + 1) : 0;
  const daily = (isCurrent && available > 0 && daysRemaining > 0) ? available / daysRemaining : 0;

  const savingsRate = income > 0 ? (savings + invest) / income : 0;
  const cashFlow = income - living - savings - invest - taxes;

  return { income, living, savings, invest, taxes, plannedIncome, plannedOut,
           taxRecommended, taxGap, liquid, available, daysRemaining, daily,
           savingsRate, cashFlow, isCurrent, upcomingRecurrings, recurringCharges, recurringIncome };
}

function budgetLines(y, m) {
  return (S.budgets && S.budgets[`${y}-${m}`]) || [];
}

function budgetReport(y, m) {
  const monthTx = transactions.filter(t => inMonth(t, y, m) && t.status === "posted");
  const lines = budgetLines(y, m).map(({ cat, amount: plannedAmt }) => {
    const kind = CATEGORIES[cat];
    const types = kind === "expense" ? ["expense", "debtPayment"] : kind === "saving" ? ["saving"]
                : kind === "investment" ? ["investment"] : kind === "tax" ? ["taxPayment"] : ["income"];
    let actual = 0;
    for (const t of monthTx) {
      if (t.cat !== cat) continue;
      if (types.includes(t.type)) actual += t.amount;
      else if (kind === "expense" && t.type === "refund") actual -= t.amount;
    }
    return { cat, kind, planned: plannedAmt, actual, variance: plannedAmt - actual, over: actual > plannedAmt };
  });
  const budgeted = new Set(budgetLines(y, m).map(l => l.cat));
  const out = {};
  for (const t of monthTx) {
    if (t.type === "transfer" || t.type === "adjustment" || t.type === "income") continue;
    if (t.cat && budgeted.has(t.cat)) continue;
    const key = t.cat || "Sans catégorie";
    out[key] = (out[key] || 0) + (t.type === "refund" ? -t.amount : t.amount);
  }
  return { lines, outOfBudget: Object.entries(out).filter(([, v]) => v !== 0) };
}

function monthNav() {

  </div>`;
}

function txRow(t) {
  const inflow = t.type === "income" || t.type === "refund";
  const neutral = t.type === "transfer";
  const cls = neutral ? "info" : inflow ? "pos" : "neg";
  const sign = neutral ? "" : inflow ? "+" : "−";
  const destAccount = t.dest ? ACCOUNTS.find(a => a.id === t.dest) : null;
  const destName = destAccount ? " → " + esc(destAccount.name) : "";
  const plannedBadge = t.status === "planned" ? '<span class="badge planned">Prévu</span>' : "";
  return `<div class="card row tx" data-txid="${t.id}" role="button" tabindex="0" style="cursor:pointer">
    <div class="ico" aria-hidden="true">${TYPE_ICON[t.type] || "•"}</div>
    <div class="meta">
      <div class="t">${esc(t.title)}${plannedBadge}</div>
      <div class="s">${String(t.d).padStart(2, "0")}.${String(t.m).padStart(2, "0")}.${t.y} · ${TYPE_LABEL[t.type]}${destName}</div>
    </div>
    <span class="amount ${cls}">${sign}${chf(t.amount)}</span>
  </div>`;
}

function renderBudget() {
  const { y, m } = MONTHS[monthIndex];
  const report = budgetReport(y, m);
  // Les lignes d'épargne/impôts ne gonflent pas le « reste à dépenser »
  // (règle Phase 5 : le planifié de dépense seul compte ici).
  const spending = report.lines.filter(l => l.kind === "expense");
  const totalPlanned = spending.reduce((a, l) => a + l.planned, 0);
  const totalActual = spending.reduce((a, l) => a + l.actual, 0);
  const remaining = totalPlanned - totalActual;

  const groups = [
    ["Essentiel", report.lines.filter(l => l.kind === "expense" && ["Logement", "Assurance maladie", "Alimentation", "Transports"].includes(l.cat))],
    ["Discrétionnaire", report.lines.filter(l => l.kind === "expense" && !["Logement", "Assurance maladie", "Alimentation", "Transports"].includes(l.cat))],
    ["Épargne et investissements", report.lines.filter(l => l.kind === "saving" || l.kind === "investment")],
    ["Impôts", report.lines.filter(l => l.kind === "tax")],
  ];

  const lineHTML = ([title, lines]) => !lines.length ? "" : `
    <p class="section-title">${title}</p>` + lines.map(l => {
      const fr = Math.min(1, l.planned > 0 ? l.actual / l.planned : 1);
      const cls = l.over ? "over-fill" : fr > 0.85 ? "warn-fill" : "";
      return `<div class="card row" data-linecat="${esc(l.cat)}" role="button" tabindex="0" style="cursor:pointer">
        <div class="bar-row" style="margin:0">
          <div class="bar-head"><span>${l.cat}${l.over ? '<span class="badge">Dépassé</span>' : ""}</span>
            <span class="vals">${chf(l.actual)} / ${chf(l.planned)}</span></div>
          <div class="track"><div class="fill ${cls}" style="width:${(fr * 100).toFixed(1)}%"></div></div>
          <div class="bar-foot">${l.over ? "Dépassement de " + chf(-l.variance) : "Reste " + chf(l.variance)}</div>
        </div>
      </div>`;
    }).join("");

  const outHTML = !report.outOfBudget.length ? "" : `
    <p class="section-title">Hors budget</p>` + report.outOfBudget.map(([cat, v]) => `
    <div class="card row tx"><div class="meta"><div class="t">${cat}</div></div>
      <span class="amount">${chf(v)}</span></div>`).join("");

  const hasLines = report.lines.length > 0;
  const prevMonth = monthIndex > 0 ? MONTHS[monthIndex - 1] : null;
  const prevHasLines = prevMonth ? budgetLines(prevMonth.y, prevMonth.m).length > 0 : false;
  if (!hasLines) {
    return `<h2 class="screen-title">Budget</h2>
      ${monthNav()}
      <div class="card">
        <p class="card-label">Aucun budget pour ${MONTHS[monthIndex].label}</p>
        <p style="font-size:13.5px;color:var(--coolgray);margin:6px 0 12px">Fixez un montant planifié par catégorie : le réel viendra s'y comparer, sans jamais s'y mélanger.</p>
        ${prevHasLines ? `<button class="btn" data-copybudget style="margin-bottom:8px">Copier le budget de ${prevMonth.label}</button>` : ""}
        <button class="btn secondary" data-addline>＋ Ajouter une ligne budgétaire</button>
      </div>`;
  }
  return `<h2 class="screen-title">Budget</h2>
    ${monthNav()}
    <div class="card hero">
      <p class="card-label">Reste à dépenser (dépenses budgétées)</p>
      <p class="hero-amount ${remaining < 0 ? "neg" : ""}">${chf(remaining)}</p>
      <span class="caption">Dépenses : planifié ${chf(totalPlanned)} · réel ${chf(totalActual)} — l'épargne et les impôts sont suivis à part</span>
    </div>
    ${groups.map(lineHTML).join("")}
    <button class="btn secondary" data-addline style="margin-top:8px">＋ Ajouter une ligne budgétaire</button>
    ${outHTML}
    <p class="section-title">Année 2026</p>
    <div class="card">
      <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;text-align:center">
        ${["jan","fév","mar","avr","mai","juin","juil","août","sep","oct","nov","déc"].map((lbl, i) => {
          const monthEntry = MONTHS.find(mm => mm.m === i + 1 && mm.y === 2026);
          let consumed = null;
          if (monthEntry) {
            const cellSpending = budgetReport(monthEntry.y, monthEntry.m).lines.filter(l => l.kind === "expense");
            const cellPlanned = cellSpending.reduce((a, l) => a + l.planned, 0);
            consumed = cellPlanned > 0
              ? Math.round(cellSpending.reduce((a, l) => a + l.actual, 0) / cellPlanned * 100) : 0;
          }
          return `<div style="padding:8px 2px;border-radius:10px;background:${monthEntry ? "rgba(75,92,255,0.16)" : "rgba(255,255,255,0.04)"}">
            <div style="font-size:10px;color:var(--coolgray);text-transform:uppercase">${lbl}</div>
            <div style="font-size:12px;font-weight:700;margin-top:2px">${monthEntry ? consumed + " %" : "—"}</div>
          </div>`;
        }).join("")}
      </div>
      <span class="caption" style="display:block;margin-top:8px">Part du budget de dépenses consommée par mois (grille annuelle de l'app).</span>
    </div>`;
}

/* ---------- Impôts (Phase 7) : estimé = payé + encore dû, toujours ----------
   Tout est DÉRIVÉ des mouvements réels — aucune constante magique. */
function renderTaxes() {
  // Revenu mensuel moyen observé (mouvements + salaire prévu), annualisé.
  const monthlyIncomes = MONTHS.map(({ y, m }) =>
    transactions.filter(t => inMonth(t, y, m) && t.type === "income")
      .reduce((a, t) => a + t.amount, 0));
  const observed = monthlyIncomes.filter(v => v > 0);
  const monthlyAverage = observed.length ? observed.reduce((a, b) => a + b, 0) / observed.length : 0;
  const estimated = Math.round(monthlyAverage * 12 * TAX_RATE * 100) / 100;
  const paid = transactions
    .filter(t => t.type === "taxPayment" && t.status === "posted")
    .reduce((a, t) => a + t.amount, 0);
  const due = Math.max(0, estimated - paid);
  const reserved = S.taxReserve ?? 2400;
  const reserveGap = Math.max(0, due - reserved);
  return backBar("Impôts 2026") + `
    <div class="card hero">
      <p class="card-label">Encore dû (arriérés compris)</p>
      <p class="hero-amount warn">${chf(due)}</p>
      <span class="caption warn">⚠ Réserve manquante : ${chf(reserveGap)}</span>
    </div>
    <div class="stat-grid">
      <div class="stat"><span class="card-label">Estimation annuelle</span><span class="amount">${chf(estimated)}</span>
        <span class="caption">Revenus × ${pct(TAX_RATE)}</span></div>
      <div class="stat"><span class="card-label">Déjà payé</span><span class="amount pos">${chf(paid)}</span>
        <span class="caption">Mouvements « Paiement d'impôts »</span></div>
      <div class="stat"><span class="card-label">Réserve constituée</span><span class="amount info">${chf(reserved)}</span></div>
      <div class="stat"><span class="card-label">Arriérés</span><span class="amount">${chf(0)}</span>
        <span class="caption">Années précédentes</span></div>
    </div>
    <p class="section-title">Échéances</p>
    <div class="card row tx"><div class="ico" aria-hidden="true">🗓</div>
      <div class="meta"><div class="t">Acompte cantonal</div><div class="s">30.09.2026</div></div>
      <span class="amount">${chf(850)}</span></div>
    <div class="card row tx"><div class="ico" aria-hidden="true">🗓</div>
      <div class="meta"><div class="t">Décompte final estimé</div><div class="s">31.03.2027</div></div>
      <span class="amount">${chf(Math.max(0, due - 850))}</span></div>
    <p class="caption" style="padding:0 4px">Estimation d'organisation personnelle, pas un conseil fiscal. Estimé = payé + encore dû, toujours — le taux (30 %) se corrige dans le profil.</p>`;
}

/* Navigation de l'onglet Plus + actions (délégation d'événements). */
document.getElementById("screen").addEventListener("click", (e) => {
  const txEl = e.target.closest("[data-txid]");
  if (txEl) {
    const tx = transactions.find(t => t.id === Number(txEl.dataset.txid));
    if (tx) openTxSheet(tx);
    return;
  }
  const accEl = e.target.closest("[data-accid]");
  if (accEl) {
    const account = ACCOUNTS.find(a => a.id === accEl.dataset.accid);
    if (account) openAccSheet(account);
    return;
  }
  if (e.target.closest("[data-addacc]")) { openAccSheet(null); return; }
  const lineEl = e.target.closest("[data-linecat]");
  if (lineEl) { openLineSheet(lineEl.dataset.linecat); return; }
  if (e.target.closest("[data-addline]")) { openLineSheet(null); return; }
  if (e.target.closest("[data-copybudget]")) {
    const previous = monthIndex > 0 ? MONTHS[monthIndex - 1] : null;
    if (!previous) return;
    const source = budgetLines(previous.y, previous.m);
    const { y, m } = MONTHS[monthIndex];
    S.budgets[`${y}-${m}`] = source.map(l => ({ ...l }));
    saveState();
    toast("Budget copié — ajustez librement, le mois source reste intact");
    render();
    return;
  }
  const entry = e.target.closest("[data-more]");
  if (entry) { moreView = entry.dataset.more; render(); scrollTop(); pushNav(); return; }
  if (e.target.closest("[data-back]")) { moreView = null; render(); scrollTop(); return; }
  if (e.target.closest("[data-togglelock]")) {
    S.faceIDEnabled = !S.faceIDEnabled;
    if (!S.faceIDEnabled) locked = false;
    saveState();
    toast(S.faceIDEnabled ? "Verrouillage activé" : "Verrouillage désactivé");
    render(); return;
  }
  if (e.target.closest("[data-locknow]")) { locked = true; lockMessage = ""; render(); return; }
  if (e.target.closest("[data-exportcsv]")) { exportCSV(); return; }
  if (e.target.closest("[data-exportjson]")) { exportBackup(); return; }
  if (e.target.closest("[data-restorepick]")) { document.getElementById("restoreFile").click(); return; }
  if (e.target.closest("[data-deleteall]")) { deleteAllData(); return; }
  if (e.target.closest("[data-resetdemo]")) {
    if (!confirm("Revenir aux données de démonstration ? Vos ajouts et modifications seront effacés.")) return;
    try {
      localStorage.removeItem(APP_STATE_KEY);
      localStorage.removeItem(LEGACY_TX_KEY);
    } catch (err) {}
    location.reload();
    return;
  }
  if (e.target.closest("[data-unlock]")) { locked = false; lockMessage = ""; render(); return; }
  if (e.target.closest("[data-unlockcancel]")) {
    // Annuler garde l'app verrouillée, sans message d'erreur (règle Phase 12).
    lockMessage = "Authentification annulée — l'app reste verrouillée.";
    render(); return;
  }
});

    investment: ["investment"], taxPayment: ["tax"], refund: ["expense"],
  }[type];
  if (!kinds) { // virement interne : pas de catégorie
    catSelect.innerHTML = '<option value="">— (virement interne)</option>';
    catSelect.disabled = true;
    return;
  }
  catSelect.disabled = false;
  catSelect.innerHTML = Object.entries(CATEGORIES)
    .filter(([, k]) => kinds.includes(k))
    .map(([c]) => `<option>${esc(c)}</option>`).join("");
}
document.getElementById("fType").addEventListener("change", refreshCatOptions);

function openTxSheet(tx) {
  editingTxId = tx ? tx.id : null;
  document.getElementById("txForm").reset();
  document.getElementById("sheetTitle").textContent = tx ? "Modifier le mouvement" : "Nouveau mouvement";
  document.getElementById("fDelete").style.display = tx ? "block" : "none";
  const typeSelect = document.getElementById("fType");
  if (tx) {
    document.getElementById("fTitle").value = tx.title;
    document.getElementById("fAmount").value = tx.amount.toFixed(2);
    typeSelect.value = tx.type === "adjustment" ? "expense" : tx.type;
    refreshCatOptions();
    if (tx.cat) catSelect.value = tx.cat;
    document.getElementById("fDate").value =
      `${tx.y}-${String(tx.m).padStart(2, "0")}-${String(tx.d).padStart(2, "0")}`;
  } else {
    refreshCatOptions();
    const { y, m } = MONTHS[monthIndex];
    const isCurrent = (y === NOW.y && m === NOW.m);
    document.getElementById("fDate").value =
      `${y}-${String(m).padStart(2, "0")}-${String(isCurrent ? NOW.d : 28).padStart(2, "0")}`;
  }
  document.getElementById("fError").textContent = "";
  openSheet("txForm");
  document.getElementById("fTitle").focus();
}

document.getElementById("fab").addEventListener("click", () => openTxSheet(null));
document.getElementById("fCancel").addEventListener("click", () => backdrop.classList.remove("open"));
backdrop.addEventListener("click", (e) => { if (e.target === backdrop) backdrop.classList.remove("open"); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && backdrop.classList.contains("open")) backdrop.classList.remove("open");
});

document.getElementById("fDelete").addEventListener("click", () => {
  if (editingTxId == null) return;
  if (!confirm("Supprimer définitivement ce mouvement ?")) return;
  const index = transactions.findIndex(t => t.id === editingTxId);
  if (index >= 0) transactions.splice(index, 1);
  saveState();
  backdrop.classList.remove("open");
  toast("Mouvement supprimé");
  render();
});

document.getElementById("txForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const err = document.getElementById("fError");
  const title = document.getElementById("fTitle").value.trim();
  const raw = document.getElementById("fAmount").value.trim()
    .replace(/["'\u2019\u00a0 ]/g, "").replace(",", ".");
  const amount = /^\d{1,9}(\.\d+)?$/.test(raw) ? parseFloat(raw) : NaN;
  if (!title) { err.textContent = "Donnez un intitulé à ce mouvement."; return; }
  if (!(amount > 0)) { err.textContent = "Le montant doit être supérieur à zéro. Exemple : 45.50"; return; }

  const dateMatch = /^(\d{4})-(\d{2})-(\d{2})$/.exec(document.getElementById("fDate").value);
  if (!dateMatch) { err.textContent = "Choisissez une date."; return; }
  const y = Number(dateMatch[1]), m = Number(dateMatch[2]), d = Number(dateMatch[3]);
  const targetMonthIndex = MONTHS.findIndex(mm => mm.y === y && mm.m === m);
  if (targetMonthIndex < 0) {
    err.textContent = "La démo couvre avril à juin 2026 — choisissez une date dans cette période.";
    return;
  }

  const type = document.getElementById("fType").value;
  let dest = null;
  if (DEST_BY_TYPE[type]) {
    const wantedKind = { saving: "savings", investment: "pension", transfer: "cash" }[type];
    const target = ACCOUNTS.find(a => a.id === DEST_BY_TYPE[type])
      || ACCOUNTS.find(a => a.kind === wantedKind);
    if (!target) {
      err.textContent = "Créez d'abord un compte de destination (Comptes → ＋) pour ce type de mouvement.";
      return;
    }
    dest = target.id;
  }
  const cat = type === "transfer" ? null : catSelect.value;
  const status = (y === NOW.y && m === NOW.m && d > NOW.d) ? "planned" : "posted";
  const existing = editingTxId != null ? transactions.find(t => t.id === editingTxId) : null;
  if (existing) {
    Object.assign(existing, {
      title, amount: Math.round(amount * 100) / 100,
      y, m, d, status, type, cat, dest, acc: existing.acc || "cur",
    });
    toast("Mouvement modifié");
  } else {
    transactions.push({
      id: ++txSeq, y, m, d,
      title, amount: Math.round(amount * 100) / 100,
      type, cat, acc: "cur", dest, status,
    });
    toast(status === "planned" ? "Mouvement planifié" : "Mouvement ajouté");
  }
  saveState();
  monthIndex = targetMonthIndex;
  backdrop.classList.remove("open");
  render();
});

/* ---------- Export / sauvegarde / restauration (tout en local) ---------- */
function downloadFile(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = name;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 5000);
}
function fileStamp() {
  return `${NOW.y}-${String(NOW.m).padStart(2, "0")}-${String(NOW.d).padStart(2, "0")}`;
}
function csvEscape(field) {
  const s = String(field);
  return (s.includes(";") || s.includes('"') || s.includes("\n"))
    ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCSV() {
  const lines = ["date;type;statut;montant;devise;compte;vers_compte;categorie;intitule"];
  for (const t of [...transactions].sort((a, b) => (a.y - b.y) || (a.m - b.m) || (a.d - b.d))) {
    const account = ACCOUNTS.find(a => a.id === t.acc);
    const dest = t.dest ? ACCOUNTS.find(a => a.id === t.dest) : null;
    lines.push([
      `${t.y}-${String(t.m).padStart(2, "0")}-${String(t.d).padStart(2, "0")}`,
      t.type, t.status, t.amount.toFixed(2), "CHF",
      csvEscape(account ? account.name : ""), csvEscape(dest ? dest.name : ""),
      csvEscape(t.cat || ""), csvEscape(t.title),
    ].join(";"));
  }
  downloadFile(`budget-mouvements-${fileStamp()}.csv`, lines.join("\n"), "text/csv");
  toast("Export CSV téléchargé");
}
function exportBackup() {
  const payload = { app: "budget-web", version: 1, exportedAt: new Date().toISOString(), state: S };
  downloadFile(`budget-sauvegarde-${fileStamp()}.json`, JSON.stringify(payload, null, 2), "application/json");
  toast("Sauvegarde téléchargée");
}
function restoreFromFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let payload = null;
    try { payload = JSON.parse(reader.result); } catch (e) { payload = null; }
    if (!payload || payload.app !== "budget-web" || !payload.state
        || !Array.isArray(payload.state.transactions) || !Array.isArray(payload.state.accounts)) {
      toast("Sauvegarde illisible — rien n'a été modifié");
      return;
    }
    if (payload.version > 1) {
      toast("Sauvegarde d'une version plus récente — rien n'a été modifié");
      return;
    }
    if (!confirm("La restauration REMPLACE toutes les données actuelles. Continuer ?")) return;
    try {
      localStorage.setItem(APP_STATE_KEY, JSON.stringify(payload.state));
      location.reload();
    } catch (e) { toast("Stockage indisponible — restauration impossible"); }
  };
  reader.readAsText(file);
}
function deleteAllData() {
  if (!confirm("Supprimer TOUS les mouvements, objectifs, récurrents et éléments de patrimoine ?")) return;
  if (!confirm("Vraiment ? Cette action est définitive (les comptes et leur solde d'ouverture restent).")) return;
  transactions.length = 0;
  GOALS.length = 0;
  RECURRINGS.length = 0;
  ASSETS.length = 0;
  LIABILITIES.length = 0;
  PENSIONS.length = 0;
  INSURANCES.length = 0;
  saveState();
  moreView = null;
  toast("Toutes les données ont été supprimées");
  render();
}


/* ---------- Feuille compte (W2) ---------- */
let editingAccId = null;
function parseAmountField(rawValue) {
  const raw = String(rawValue).trim().replace(/["'\u2019\u00a0 ]/g, "").replace(",", ".");
  return /^\d{1,9}(\.\d+)?$/.test(raw) ? Math.round(parseFloat(raw) * 100) / 100 : NaN;
}
function openAccSheet(account) {
  editingAccId = account ? account.id : null;
  document.getElementById("accForm").reset();
  document.getElementById("accSheetTitle").textContent = account ? "Modifier le compte" : "Nouveau compte";
  document.getElementById("aDelete").style.display = account ? "block" : "none";
  if (account) {
    document.getElementById("aName").value = account.name;
    document.getElementById("aInst").value = account.inst || "";
    document.getElementById("aKind").value = account.kind;
    document.getElementById("aOpening").value = account.opening.toFixed(2);
    document.getElementById("aCash").checked = !!account.cash;
  } else {
    document.getElementById("aCash").checked = true;
  }
  document.getElementById("aError").textContent = "";
  openSheet("accForm");
  document.getElementById("aName").focus();
}
document.getElementById("aCancel").addEventListener("click", () => backdrop.classList.remove("open"));
document.getElementById("accForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const err = document.getElementById("aError");
  const name = document.getElementById("aName").value.trim();
  if (!name) { err.textContent = "Donnez un nom à ce compte."; return; }
  const openingRaw = document.getElementById("aOpening").value.trim();
  const opening = openingRaw === "" ? 0 : parseAmountField(openingRaw);
  if (Number.isNaN(opening)) { err.textContent = "Solde d'ouverture invalide. Exemple : 1200.00"; return; }
  const kind = document.getElementById("aKind").value;
  const cash = document.getElementById("aCash").checked;
  const inst = document.getElementById("aInst").value.trim();
  const existing = editingAccId ? ACCOUNTS.find(a => a.id === editingAccId) : null;
  if (existing) {
    Object.assign(existing, { name, inst, kind, opening, cash });
    toast("Compte modifié");
  } else {
    const id = "acc-" + Date.now().toString(36);
    ACCOUNTS.push({ id, name, inst, kind, opening, cash });
    toast("Compte ajouté");
  }
  saveState();
  backdrop.classList.remove("open");
  render();
});
function canDeleteAccount(id) {
  // Règle .deny du natif : un compte portant des mouvements ne se
  // supprime pas — on supprime ou réaffecte d'abord les mouvements.
  return !transactions.some(t => t.acc === id || t.dest === id);
}
document.getElementById("aDelete").addEventListener("click", () => {
  if (!editingAccId) return;
  if (!canDeleteAccount(editingAccId)) {
    document.getElementById("aError").textContent =
      "Ce compte porte des mouvements — supprimez-les d'abord (l'historique ne disparaît jamais en silence).";
    return;
  }
  if (!confirm("Supprimer ce compte ?")) return;
  const index = ACCOUNTS.findIndex(a => a.id === editingAccId);
  if (index >= 0) ACCOUNTS.splice(index, 1);
  saveState();
  backdrop.classList.remove("open");
  toast("Compte supprimé");
  render();
});

/* ---------- Feuille ligne budgétaire (W2) ---------- */
let editingLineCat = null;
function openLineSheet(cat) {
  editingLineCat = cat || null;
  const { y, m } = MONTHS[monthIndex];
  const lines = budgetLines(y, m);
  document.getElementById("lineForm").reset();
  document.getElementById("lineSheetTitle").textContent = cat ? "Modifier la ligne" : "Nouvelle ligne budgétaire";
  document.getElementById("lDelete").style.display = cat ? "block" : "none";
  const select = document.getElementById("lCat");
  if (cat) {
    select.innerHTML = `<option>${esc(cat)}</option>`;
    select.disabled = true;
    const line = lines.find(l => l.cat === cat);
    document.getElementById("lAmount").value = line ? line.amount.toFixed(2) : "";
  } else {
    const taken = new Set(lines.map(l => l.cat));
    const available = Object.keys(CATEGORIES).filter(c => !taken.has(c) && CATEGORIES[c] !== "income");
    if (!available.length) {
      toast("Toutes les catégories sont déjà budgétées ce mois");
      return;
    }
    select.disabled = false;
    select.innerHTML = available.map(c => `<option>${esc(c)}</option>`).join("");
  }
  document.getElementById("lError").textContent = "";
  openSheet("lineForm");
  document.getElementById("lAmount").focus();
}
document.getElementById("lCancel").addEventListener("click", () => backdrop.classList.remove("open"));
document.getElementById("lineForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const err = document.getElementById("lError");
  const amount = parseAmountField(document.getElementById("lAmount").value);
  if (!(amount > 0)) { err.textContent = "Montant planifié invalide. Exemple : 250.00"; return; }
  const { y, m } = MONTHS[monthIndex];
  const key = `${y}-${m}`;
  if (!S.budgets[key]) S.budgets[key] = [];
  const cat = editingLineCat || document.getElementById("lCat").value;
  const line = S.budgets[key].find(l => l.cat === cat);
  if (line) { line.amount = amount; toast("Ligne modifiée"); }
  else { S.budgets[key].push({ cat, amount }); toast("Ligne ajoutée"); }
  saveState();
  backdrop.classList.remove("open");
  render();
});
document.getElementById("lDelete").addEventListener("click", () => {
  if (!editingLineCat) return;
  if (!confirm(`Retirer « ${editingLineCat} » du budget de ce mois ? (les mouvements restent)`)) return;
  const { y, m } = MONTHS[monthIndex];
  const lines = S.budgets[`${y}-${m}`] || [];
  const index = lines.findIndex(l => l.cat === editingLineCat);
  if (index >= 0) lines.splice(index, 1);
  saveState();
  backdrop.classList.remove("open");
  toast("Ligne retirée");
  render();
});

/* ---------- Retour naturel du navigateur (History API) ---------- */
function pushNav() {
  try { history.pushState({ tab: activeTab, more: moreView }, ""); } catch (e) {}
}
try { history.replaceState({ tab: activeTab, more: moreView }, ""); } catch (e) {}
window.addEventListener("popstate", (e) => {
  const state = e.state || { tab: "home", more: null };
  activeTab = state.tab || "home";
  moreView = state.more || null;
  render();
  scrollTop();
});

render();
</script>
